<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảo Hiểm Xã Hội Cơ Sở Cái Nước</title>
    <!-- Nhúng Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Tiêu đề tích hợp hình nền và logo */
        .hero-header { 
            background: linear-gradient(135deg, rgba(227, 242, 253, 0.92) 0%, rgba(187, 222, 251, 0.92) 100%), 
                        url('anhbia.jpg');
            background-size: cover, cover;
            background-position: center, center;
            background-repeat: no-repeat, no-repeat;
            color: #1e293b; 
            padding: 18px 25px; 
            border-radius: 0 0 16px 16px; 
            margin-bottom: 20px; 
            box-shadow: 0 4px 12px rgba(33, 150, 243, 0.12);
            border-bottom: 4px solid #0d6efd;
        }
        
        .logo-bhxh { 
            width: 65px; 
            height: 65px; 
            object-fit: contain; 
            flex-shrink: 0; 
        }

        .brand-top-sub {
            color: #333333;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin: 0 0 2px 0;
        }

        .brand-title {
            color: #b71c1c;
            font-weight: 800; /* Tô đậm chữ */
            font-size: 1.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1.2;
            margin: 0;
            display: inline-block;
            transform: scaleY(1.25);
            transform-origin: left bottom;
        }
    </style>
</head>
<body class="bg-light">

    <!-- TIÊU ĐỀ TÍCH HỢP HÌNH NỀN VÀ LOGO -->
    <div class="container mt-3">
        <div class="hero-header">
            <div class="d-flex align-items-center gap-3">
                <!-- Lưu ý: Kiểm tra lại định dạng file ảnh thực tế (.jpg hoặc .png) và tên file -->
                <img src="logo.jpg" alt="Logo BHXH" class="logo-bhxh">
                <div>
                    <p class="brand-top-sub">BẢO HIỂM XÃ HỘI TỈNH CÀ MAU</p>
                    <h1 class="brand-title">BẢO HIỂM XÃ HỘI CƠ SỞ CÁI NƯỚC</h1>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
